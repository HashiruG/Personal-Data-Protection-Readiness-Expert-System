<rect x="540" y="533" width="300" height="64" rx="0" ry="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="690.0" y="560.8" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Evaluate R16-R23</text>
<text x="690.0" y="579.0" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">(Schedule II); R24 if none fires</text>
