<text x="330" y="315.79999999999995" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">Does any of R1-R5 fire?</text>
<text x="330" y="333.99999999999994" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">(scope, s.2(1))</text>
<rect x="180" y="410" width="300" height="64" rx="0" ry="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="330.0" y="437.79999999999995" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Evaluate R8-R13</text>
<text x="330.0" y="455.99999999999994" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">(Schedule I); R14 if none fires</text>
<polygon points="330,505.0 475.0,565 330,625.0 185.0,565" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="330" y="560.8" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">Does R15 fire?</text>
<text x="330" y="579.0" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">(special categories, s.56)</text>
