<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1250" viewBox="0 0 900 1250" font-family="Liberation Sans, Arial, Helvetica, sans-serif"><title>Consultation flow</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker><marker id="arrowstart" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#000"/></marker></defs><rect width="900" height="1250" fill="#fff"/><rect x="250" y="20" width="160" height="44" rx="22" ry="22" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="330.0" y="46.9" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Start</text>
<polygon points="330,100.0 475.0,160 330,220.0 185.0,160" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="330" y="155.8" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">Does R6 or R7 fire?</text>
<text x="330" y="174.0" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">(exclusions, s.2(3))</text>
