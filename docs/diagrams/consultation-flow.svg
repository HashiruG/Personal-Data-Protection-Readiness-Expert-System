<text x="330" y="760.8" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">Is consent relied on?</text>
<text x="330" y="779.0" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">(R8 or R16 fired)</text>
<rect x="180" y="885" width="300" height="64" rx="0" ry="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="330.0" y="912.8" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Evaluate R29-R32</text>
<text x="330.0" y="931.0" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">(Data Protection Officer, s.20(1))</text>
<rect x="180" y="985" width="300" height="64" rx="0" ry="0" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="330.0" y="1012.8" font-size="14" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Evaluate R33-R34</text>
<text x="330.0" y="1031.0" font-size="14" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">(impact assessment, s.24(1))</text>
